services:
  - type: web
    name: auto-layer-hard
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    plan: pro
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HARD_BUSY_EXTRACT
        value: auto
      - key: HARD_BUSY_GPT_EXTRACT
        value: "12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SAM_MODEL
        value: sam2_b.pt
      - key: PRELOAD_SAM
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
